name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Configure Git Line Endings
        run: git config --global core.autocrlf false

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Nox (Windows)
        shell: powershell
        run: |
          $env:NOX_VERSION = "v2.1.0"
          irm https://raw.githubusercontent.com/mburakmmm/nox-lang/main/install.ps1 | iex
          "$env:USERPROFILE\.nox-lang\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Compiler
        run: |
          noxc version

      - name: Static Type Check
        run: |
          noxc check vault.nox
          noxc check cli/main.nox
          noxc check adapters/aether.nox
          noxc check adapters/nyx.nox
          noxc check adapters/feather.nox
          noxc check adapters/noxen.nox
          noxc check adapters/nova.nox

      - name: Run Test Suites
        run: |
          noxc test

      - name: Verify CLI Tool
        run: |
          noxc run cli/main.nox -- version
          noxc run cli/main.nox -- --help

  test-ubuntu:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Nox (Linux via gh)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v2.1.0 -R mburakmmm/nox-lang -p "nox-lang-v2.1.0-linux-x64.tar.gz"
          mkdir -p "$HOME/.nox-lang"
          tar xzf nox-lang-v2.1.0-linux-x64.tar.gz -C "$HOME/.nox-lang" --strip-components=1
          chmod +x "$HOME/.nox-lang/bin/"*
          echo "$HOME/.nox-lang/bin" >> $GITHUB_PATH

      - name: Verify Compiler
        run: |
          noxc version

      - name: Static Type Check
        run: |
          noxc check vault.nox
          noxc check cli/main.nox

      - name: Run Test Suites
        run: |
          noxc test
