name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            asset: nox-lang-v2.1.0-linux-x64.tar.gz
            is_windows: false

          - platform: linux-arm64
            os: ubuntu-24.04-arm
            asset: nox-lang-v2.1.0-linux-arm64.tar.gz
            is_windows: false

          - platform: macos-arm64
            os: macos-latest
            asset: nox-lang-v2.1.0-macos-arm64.tar.gz
            is_windows: false

          - platform: windows-x64
            os: windows-latest
            asset: nox-lang-v2.1.0-windows-x64.zip
            is_windows: true

    steps:
      - name: Configure Git Line Endings
        run: git config --global core.autocrlf false

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MinGW Toolchain (Windows)
        if: matrix.is_windows
        shell: powershell
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Nox (${{ matrix.platform }}) - Unix
        if: ${{ !matrix.is_windows }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v2.1.0 -R mburakmmm/nox-lang -p "${{ matrix.asset }}"
          mkdir -p "$HOME/.nox-lang"
          tar xzf "${{ matrix.asset }}" -C "$HOME/.nox-lang" --strip-components=1
          chmod +x "$HOME/.nox-lang/bin/"*
          echo "$HOME/.nox-lang/bin" >> $GITHUB_PATH

      - name: Install Nox (${{ matrix.platform }}) - Windows
        if: matrix.is_windows
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v2.1.0 -R mburakmmm/nox-lang -p "${{ matrix.asset }}"
          $InstallDir = "$env:USERPROFILE\.nox-lang"
          New-Item -ItemType Directory -Force -Path $InstallDir | Out-Null
          Expand-Archive -Path "${{ matrix.asset }}" -DestinationPath "$env:TEMP\nox_extract" -Force
          if (Test-Path "$env:TEMP\nox_extract\nox-lang-v2.1.0-windows-x64") {
              Copy-Item -Recurse -Force "$env:TEMP\nox_extract\nox-lang-v2.1.0-windows-x64\*" $InstallDir
          } else {
              Copy-Item -Recurse -Force "$env:TEMP\nox_extract\*" $InstallDir
          }
          "$InstallDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Compiler
        run: |
          noxc version

      - name: Static Type Check
        run: |
          noxc check vault.nox
          noxc check cli/main.nox
          noxc check adapters/aether.nox
          noxc check adapters/nyx.nox
          noxc check adapters/feather.nox
          noxc check adapters/noxen.nox
          noxc check adapters/nova.nox

      - name: Run Test Suites
        run: |
          noxc test

      - name: Verify CLI Tool
        run: |
          noxc run cli/main.nox -- version
          noxc run cli/main.nox -- --help
