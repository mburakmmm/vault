name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    name: Static Type Analysis
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify NOX toolchain
        run: |
          noxc version

      - name: Check Public Facade
        run: |
          noxc check vault.nox

      - name: Check CLI & Adapters
        run: |
          noxc check cli/main.nox
          noxc check adapters/aether.nox
          noxc check adapters/nyx.nox
          noxc check adapters/feather.nox
          noxc check adapters/noxen.nox
          noxc check adapters/nova.nox

  test-dual-backends:
    name: Test Suite (${{ matrix.backend }})
    needs: type-check
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [llvm, qbe]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Zig for LLVM backend
        if: matrix.backend == 'llvm'
        uses: mlugg/setup-zig@v1
        with:
          version: 0.17.0

      - name: Run All 19 Test Suites
        run: |
          noxc test --backend ${{ matrix.backend }}

      - name: Test CLI Interface
        run: |
          noxc run cli/main.nox -- --help
          noxc run cli/main.nox -- version
