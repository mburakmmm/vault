name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            asset: nox-lang-v2.1.0-linux-x64.tar.gz
            is_windows: false

          - platform: linux-arm64
            os: ubuntu-24.04-arm
            asset: nox-lang-v2.1.0-linux-arm64.tar.gz
            is_windows: false

          - platform: macos-arm64
            os: macos-latest
            asset: nox-lang-v2.1.0-macos-arm64.tar.gz
            is_windows: false

          - platform: windows-x64
            os: windows-latest
            asset: nox-lang-v2.1.0-windows-x64.zip
            is_windows: true

    steps:
      - name: Configure Git Line Endings
        run: git config --global core.autocrlf false

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MinGW Toolchain (Windows)
        if: matrix.is_windows
        shell: powershell
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Nox (${{ matrix.platform }}) - Unix
        if: ${{ !matrix.is_windows }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v2.1.0 -R mburakmmm/nox-lang -p "${{ matrix.asset }}"
          mkdir -p "$HOME/.nox-lang"
          tar xzf "${{ matrix.asset }}" -C "$HOME/.nox-lang" --strip-components=1
          chmod +x "$HOME/.nox-lang/bin/"*
          echo "$HOME/.nox-lang/bin" >> $GITHUB_PATH

      - name: Install Nox (${{ matrix.platform }}) - Windows
        if: matrix.is_windows
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v2.1.0 -R mburakmmm/nox-lang -p "${{ matrix.asset }}"
          $InstallDir = "$env:USERPROFILE\.nox-lang"
          New-Item -ItemType Directory -Force -Path $InstallDir | Out-Null
          Expand-Archive -Path "${{ matrix.asset }}" -DestinationPath "$env:TEMP\nox_extract" -Force
          if (Test-Path "$env:TEMP\nox_extract\nox-lang-v2.1.0-windows-x64") {
              Copy-Item -Recurse -Force "$env:TEMP\nox_extract\nox-lang-v2.1.0-windows-x64\*" $InstallDir
          } else {
              Copy-Item -Recurse -Force "$env:TEMP\nox_extract\*" $InstallDir
          }
          "$InstallDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Compiler
        run: |
          noxc version

      - name: Static Type Check
        run: |
          noxc check vault.nox
          noxc check cli/main.nox
          noxc check adapters/aether.nox
          noxc check adapters/nyx.nox
          noxc check adapters/feather.nox
          noxc check adapters/noxen.nox
          noxc check adapters/nova.nox

      - name: Run Test Suites (QBE Backend)
        run: |
          noxc test --backend qbe

      - name: Run Test Suites (LLVM Backend)
        run: |
          noxc test --backend llvm

      - name: Verify CLI Tool
        run: |
          noxc run cli/main.nox -- version
          noxc run cli/main.nox -- --help

      - name: Verify External Package Consumer (DIST-02)
        run: |
          noxc run tests/package_consumer_test.nox

      - name: Verify Isolated External Consumer Outside Repo - Unix (DIST-03)
        if: ${{ !matrix.is_windows }}
        run: |
          ISO_DIR="$(mktemp -d)"
          cp vault.nox "$ISO_DIR/"
          cp -r core env schema secrets sources interpolate profiles providers reload cli "$ISO_DIR/"
          cp nox.json "$ISO_DIR/"
          mkdir -p "$ISO_DIR/consumer"
          cat << 'EOF' > "$ISO_DIR/consumer/main.nox"
          from vault import ConfigBuilder, ConfigSchema, ConfigSnapshot, ReloadManager, PublishedConfig, MemorySource, version
          from nox.test import assert_true, assert_eq_str, assert_eq_int

          def run_consumer() -> None:
              v: str = version()
              print("Isolated consumer running with VAULT v" + v)
              assert_eq_str(v, "1.0.12", "version check")

              schema: ConfigSchema = ConfigSchema()
              schema.add_string("APP_ENV", True, False, "production", False, True)
              schema.add_int("HTTP_PORT", True, False, 8080, True, 1024, True, 65535, False)
              schema.add_string("API_KEY", True, False, "", True, True)

              mem: MemorySource = MemorySource("app_env", 1, "base", False)
              mem.set_string("APP_ENV", "production")
              mem.set_string("HTTP_PORT", "9090")
              mem.set_string("API_KEY", "super_secret_token_12345")

              builder: ConfigBuilder = ConfigBuilder()
              builder.with_schema(schema)
              builder.with_source(mem)

              mgr: ReloadManager = ReloadManager(builder)
              pub: PublishedConfig = mgr.get_published()
              assert_eq_int(pub.version, 1, "published version 1")
              assert_eq_int(pub.snapshot.get_int("HTTP_PORT"), 9090, "port check")
              assert_eq_str(pub.snapshot.get_secret("API_KEY"), "super_secret_token_12345", "secret retrieval")

              redacted: str = pub.snapshot.redacted_json()
              assert_true("super_secret_token_12345" not in redacted, "secret redacted in JSON")
              assert_true("[REDACTED]" in redacted, "redacted marker in JSON")

              print("PASS: Isolated external consumer verified successfully outside repository root!")

          run_consumer()
          EOF
          (cd "$ISO_DIR" && noxc run consumer/main.nox)
          rm -rf "$ISO_DIR"

      - name: Verify Isolated External Consumer Outside Repo - Windows (DIST-03)
        if: matrix.is_windows
        shell: powershell
        run: |
          $IsoDir = Join-Path $env:TEMP "iso_consumer_ci"
          if (Test-Path $IsoDir) { Remove-Item -Recurse -Force $IsoDir }
          New-Item -ItemType Directory -Force -Path $IsoDir | Out-Null
          Copy-Item "vault.nox" -Destination $IsoDir
          Copy-Item -Recurse "core", "env", "schema", "secrets", "sources", "interpolate", "profiles", "providers", "reload", "cli", "nox.json" -Destination $IsoDir
          $Sub = Join-Path $IsoDir "consumer"
          New-Item -ItemType Directory -Force -Path $Sub | Out-Null
          @'
          from vault import ConfigBuilder, ConfigSchema, ConfigSnapshot, ReloadManager, PublishedConfig, MemorySource, version
          from nox.test import assert_true, assert_eq_str, assert_eq_int

          def run_consumer() -> None:
              v: str = version()
              print("Isolated consumer running with VAULT v" + v)
              assert_eq_str(v, "1.0.12", "version check")

              schema: ConfigSchema = ConfigSchema()
              schema.add_string("APP_ENV", True, False, "production", False, True)
              schema.add_int("HTTP_PORT", True, False, 8080, True, 1024, True, 65535, False)
              schema.add_string("API_KEY", True, False, "", True, True)

              mem: MemorySource = MemorySource("app_env", 1, "base", False)
              mem.set_string("APP_ENV", "production")
              mem.set_string("HTTP_PORT", "9090")
              mem.set_string("API_KEY", "super_secret_token_12345")

              builder: ConfigBuilder = ConfigBuilder()
              builder.with_schema(schema)
              builder.with_source(mem)

              mgr: ReloadManager = ReloadManager(builder)
              pub: PublishedConfig = mgr.get_published()
              assert_eq_int(pub.version, 1, "published version 1")
              assert_eq_int(pub.snapshot.get_int("HTTP_PORT"), 9090, "port check")
              assert_eq_str(pub.snapshot.get_secret("API_KEY"), "super_secret_token_12345", "secret retrieval")

              redacted: str = pub.snapshot.redacted_json()
              assert_true("super_secret_token_12345" not in redacted, "secret redacted in JSON")
              assert_true("[REDACTED]" in redacted, "redacted marker in JSON")

              print("PASS: Isolated external consumer verified successfully outside repository root!")

          run_consumer()
          '@ | Set-Content -Path (Join-Path $Sub "main.nox")
          Push-Location $IsoDir
          try {
              noxc run consumer/main.nox
          } finally {
              Pop-Location
              Remove-Item -Recurse -Force $IsoDir
          }
